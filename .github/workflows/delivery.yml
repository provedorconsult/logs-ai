name: delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: logs_ai
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: logs_ai_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U logs_ai -d logs_ai_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://logs_ai:disposable_ci_only@127.0.0.1:5432/logs_ai_ci
      TEST_DATABASE_DISPOSABLE: 'true'
      TEST_DATABASE_EXPECTED_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --locked --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest -q
      - name: Web browser checks
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p work
          node --check src/logs_ai/web/static/app.js
          .venv/bin/python tests/browser/serve.py > work/web-browser-server.log 2>&1 &
          echo $! > work/web-browser-server.pid
          npm ci --prefix tests/browser --no-audit --no-fund
          node tests/browser/web.mjs
      - name: Stop disposable browser fixture
        if: always()
        run: |
          if [ -f work/web-browser-server.pid ]; then
            fixture_pid=$(cat work/web-browser-server.pid)
            case "$(ps -p "$fixture_pid" -o args=)" in
              *tests/browser/serve.py*) kill "$fixture_pid" ;;
            esac
          fi
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt | diff requirements.txt -
      - run: docker build --build-arg APP_REVISION=${{ github.sha }} -t logs-ai:${{ github.sha }} .
      - name: Packaged web assets and entrypoint
        run: docker run --rm logs-ai:${{ github.sha }} python -c "from logs_ai.web.app import STATIC; from pathlib import Path; assert (STATIC / 'app.js').is_file(); assert Path('web_migrations/001_web.sql').is_file()"
      - name: Prepare disposable installation bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p work
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from prepare_installation import prepare
          profile = json.loads(Path("deploy/profiles/example.json").read_text())
          profile["server"].update(syslog_port=15514, core_port=18010, collector_port=18012)
          prepare(profile, os.environ["RELEASE_SHA"], Path("work/installation-ci"))
          PY
      - name: Standalone installation readiness
        env:
          RECEIVER_BIND: '127.0.0.1'
          DOKPLOY_TRANSPORT: direct
        run: |
          docker compose -p logs-ai-install-ci --env-file work/installation-ci/.env -f work/installation-ci/docker-compose.yml up -d --no-build --wait --wait-timeout 120
          python3 scripts/verify_installation.py baseline --manifest work/installation-ci/manifest.json --output work/installation-baseline.json
      - name: Compose readiness
        env:
          APP_IMAGE: logs-ai:${{ github.sha }}
          POSTGRES_PASSWORD: disposable_ci_only
          APP_PORT: '18000'
        run: docker compose -p logs-ai-smoke up -d --no-build --wait --wait-timeout 120
      - name: HTTP readiness
        env:
          DOKPLOY_TRANSPORT: direct
          APP_TEST_URL: http://127.0.0.1:18000
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 scripts/check_health.py
      - name: Clean disposable Compose stack
        if: always()
        env:
          POSTGRES_PASSWORD: disposable_ci_only
        run: docker compose -p logs-ai-smoke down -v
      - name: Clean disposable installation stack
        if: always()
        env:
          RECEIVER_BIND: '127.0.0.1'
        run: |
          if [ -f work/installation-ci/.env ]; then
            docker compose -p logs-ai-install-ci --env-file work/installation-ci/.env -f work/installation-ci/docker-compose.yml down -v
          fi
  deploy:
    permissions:
      contents: write
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DOKPLOY_CD == 'true'
    runs-on: [self-hosted, logs-ai-deploy]
    environment: homologacao
    env:
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
      DOKPLOY_PROJECT_ID: ${{ vars.DOKPLOY_PROJECT_ID }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      DOKPLOY_SSH_TUNNEL_VERIFIED: ${{ vars.DOKPLOY_SSH_TUNNEL_VERIFIED }}
      DOKPLOY_API_CONTRACT_VERIFIED: ${{ vars.DOKPLOY_API_CONTRACT_VERIFIED }}
      DOKPLOY_ALLOW_TAILNET_HTTP: ${{ vars.DOKPLOY_ALLOW_TAILNET_HTTP }}
      DOKPLOY_TAILNET_HTTP_ORIGIN: ${{ vars.DOKPLOY_TAILNET_HTTP_ORIGIN }}
      DOKPLOY_TRANSPORT: ${{ vars.DOKPLOY_TRANSPORT }}
      DOKPLOY_APPROVED_PROXY: ${{ vars.DOKPLOY_APPROVED_PROXY }}
      DOKPLOY_DEPLOYMENT_RECEIPT: work/dokploy-deployment.json
      DOKPLOY_RECOVERY_FILE: ${{ vars.DOKPLOY_RECOVERY_FILE }}
      DOKPLOY_ENV_FILE: ''
      DOKPLOY_SNAPSHOT_OWNERSHIP: ''
      GITHUB_TOKEN: ${{ github.token }}
      APP_TEST_URL: ${{ vars.APP_TEST_URL }}
      EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set canonical deployment origin
        run: |
          git remote set-url origin https://github.com/provedorconsult/logs-ai.git
          git remote set-url --push origin https://github.com/provedorconsult/logs-ai.git
      - name: Materialize authoritative Compose environment
        env:
          DOKPLOY_ENV_SNAPSHOT: ${{ secrets.DOKPLOY_ENV_SNAPSHOT }}
        run: python3 scripts/snapshot.py create
      - run: python3 scripts/deploy.py
      - run: python3 scripts/check_health.py
      - name: Remove materialized environment
        if: always()
        run: python3 scripts/snapshot.py cleanup
